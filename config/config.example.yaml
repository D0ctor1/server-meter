# server-meter configuration
# Copy to config.yaml or /etc/server-meter/config.yaml and edit.
# Sensor history and alarm state stay in RAM and are discarded on restart.
# The Settings UI may atomically rewrite the notifications: block only.

application:
  name: server-meter
  # production refuses empty auth and OpenAPI docs.
  # CHANGE_ME is the factory password; the web UI warns until you change it.
  environment: production

web:
  host: "0.0.0.0"
  port: 8080
  # CZ = čeština, EN = angličtina. If omitted, the UI uses CZ.
  locale: "CZ"
  api_docs_enabled: false
  health_public: true
  max_request_bytes: 16384
  auth:
    enabled: true
    username: "admin"
    password: "CHANGE_ME"

sensor:
  type: "BME690"
  # bme690 = official SensorAPI I²C driver + optional BSEC 3.x
  # mock    = no hardware (development / CI)
  # bme69x_python = optional community wrapper compiled against Bosch BSEC
  driver: "bme690"
  i2c:
    bus: 1
    address: 0x77   # 0x76 or 0x77
  interval_seconds: 5
  heater_temperature_c: 320
  heater_duration_ms: 150
  retry_initial_seconds: 2
  retry_max_seconds: 30
  i2c_timeout_seconds: 1.0
  bsec:
    enabled: true
    # Absolute path to Bosch libalgobsec.so for Raspberry Pi 5 aarch64.
    # Leave empty to search default locations. BSEC is NOT shipped.
    library_path: ""
    # Optional read-only BSEC config blob from the Bosch package.
    config_blob_path: ""
    # lp = 3 s (BSEC_SAMPLE_RATE_LP). ulp = 300 s.
    sample_rate: "lp"
    temperature_offset: 0.0
    # Must stay false: BSEC state is RAM-only.
    persist_state: false

history:
  max_samples: 10000
  max_age_seconds: 86400
  min_samples_keep: 64

memory_protection:
  enabled: true
  warning_percent: 70
  critical_percent: 80
  emergency_percent: 90
  warning_trim_fraction: 0.10
  critical_trim_fraction: 0.25
  emergency_trim_fraction: 0.50
  check_interval_seconds: 15

nagios:
  enabled: true
  sensor_max_age_seconds: 30
  thresholds:
    cpu_temperature_warning: 70
    cpu_temperature_critical: 80
    ram_usage_warning: 70
    ram_usage_critical: 85
    iaq_warning: 150
    iaq_critical: 250
    cpu_load_warning: 2.0
    cpu_load_critical: 4.0

logging:
  level: INFO
  # Access logs write to journald. Keep disabled to protect the SD card.
  access_log: false

# Missing this entire block is valid: email stays OFF.
# Thresholds detect significant deviations. They are NOT medical or
# occupational safety limits. BME690/BSEC reports air-quality indicators,
# not certified toxic-gas measurements.
notifications:
  enabled: false
  max_queue_size: 10
  email:
    enabled: false
    cooldown_seconds: 3600
    notify_recovery: true
    from: ""
    to: []
    web_url: ""
    smtp:
      host: ""
      port: 587
      security: "starttls"  # none | starttls | tls
      username: ""
      password: ""
      timeout_seconds: 15
  thresholds:
    temperature:
      enabled: true
      warning_high: 45
      critical_high: 50
      hysteresis: 2
      min_duration_seconds: 30
    humidity:
      enabled: true
      warning_high: 80
      critical_high: 90
      hysteresis: 2
      min_duration_seconds: 30
    pressure:
      enabled: false
      warning_low: 980
      critical_low: 960
      warning_high: 1040
      critical_high: 1060
      hysteresis: 5
      min_duration_seconds: 30
    gas_resistance:
      enabled: false
      warning_low: 20000
      critical_low: 8000
      hysteresis: 2000
      min_duration_seconds: 30
    iaq:
      enabled: true
      warning_high: 150
      critical_high: 250
      hysteresis: 10
      min_duration_seconds: 60
    iaq_accuracy:
      enabled: false
      warning_low: 1
      critical_low: 0
      hysteresis: 0
      min_duration_seconds: 300
    static_iaq:
      enabled: false
      warning_high: 150
      critical_high: 250
      hysteresis: 10
      min_duration_seconds: 60
    eco2:
      enabled: true
      warning_high: 1500
      critical_high: 2500
      hysteresis: 100
      min_duration_seconds: 60
    bvoc:
      enabled: true
      warning_high: 1.0
      critical_high: 2.0
      hysteresis: 0.1
      min_duration_seconds: 60
    cpu_temperature:
      enabled: true
      warning_high: 70
      critical_high: 80
      hysteresis: 2
      min_duration_seconds: 30
    cpu_usage:
      enabled: false
      warning_high: 85
      critical_high: 95
      hysteresis: 5
      min_duration_seconds: 60
    ram_usage:
      enabled: true
      warning_high: 70
      critical_high: 85
      hysteresis: 5
      min_duration_seconds: 60
    sensor_unavailable:
      enabled: true
      warning_high: 15
      critical_high: 30
      hysteresis: 5
      min_duration_seconds: 0
