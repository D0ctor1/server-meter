# Nagios Core 4.4.5 object configuration for server-meter.
#
# This is Nagios object configuration (host / command / services).
# It is NOT a plugin config file. Connection URL, username, password and
# Nagios thresholds live inside check_server_meter.sh.
#
# One plugin, many services: $ARG1$ selects the metric.
# Health (empty ARG1 or "health") remains the overall reachability check.
#
# place-holders replaced by scripts/install_nagios_plugin.sh:
#   __PLUGIN_PATH__    e.g. /usr/local/nagios/libexec/check_server_meter.sh
#   __HOST_NAME__      e.g. server-meter
#   __HOST_ADDRESS__   e.g. 192.168.1.50
#
# Do not copy this file a second time under another name. Re-running the
# installer overwrites this same object file (idempotent).

define command {
    command_name    check_server_meter
    command_line    __PLUGIN_PATH__ $ARG1$
}

# __BEGIN_HOST__
define host {
    use             generic-host
    host_name       __HOST_NAME__
    alias           Raspberry Pi Server Meter
    address         __HOST_ADDRESS__
}
# __END_HOST__

define service {
    use                     generic-service
    host_name               __HOST_NAME__
    service_description     Server Meter Health
    check_command           check_server_meter!health
}

define service {
    use                     generic-service
    host_name               __HOST_NAME__
    service_description     Sensor Availability
    check_command           check_server_meter!sensor
}

